name: Build Karaoke Studio

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-24.04
          - os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - name: Install dependencies
        run: npm ci
      - name: Build desktop packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BUNDLES="nsis,msi"; elif [ "$RUNNER_OS" = "macOS" ]; then BUNDLES="dmg"; else BUNDLES="appimage,deb,rpm"; fi
          npx tauri build --bundles "$BUNDLES"
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-studio-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'cmdline-tools;latest' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Install dependencies
        run: npm ci
      - name: Clean partial Android project
        run: rm -rf src-tauri/gen/android
      - name: Initialize Android project
        run: npx tauri android init --ci
      - name: Add Android microphone permissions
        run: |
          node -e 'const fs=require("node:fs"); const file="src-tauri/gen/android/app/src/main/AndroidManifest.xml"; let xml=fs.readFileSync(file,"utf8"); for (const permission of ["android.permission.RECORD_AUDIO","android.permission.MODIFY_AUDIO_SETTINGS"]) { const entry=`<uses-permission android:name="${permission}" />`; if (!xml.includes(entry)) xml=xml.replace(/(<manifest[^>]*>)/, `$1\n    ${entry}`); } fs.writeFileSync(file,xml);'
      - name: Build APK
        run: npx tauri android build --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-studio-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Initialize iOS project
        run: npx tauri ios init --ci
      - name: Build iOS simulator app
        run: npx tauri ios build --debug --target aarch64-sim --ci
      - name: Build signed iOS IPA when Apple credentials are configured
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12_BASE64" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] || [ -z "$IOS_TEAM_ID" ]; then
            echo "Apple signing secrets are not configured; only the simulator app will be built."
            exit 0
          fi
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > signing.p12
          security import signing.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' profile.plist)
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          npx tauri ios build --ci --export-method debugging -- --allowProvisioningUpdates
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-studio-ios
          path: |
            src-tauri/gen/apple/build/**
          if-no-files-found: error

  publish-desktop:
    name: Publish desktop release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Karaoke Studio ${{ github.ref_name }}" \
            --prerelease \
            --notes "Beta release. Includes local playback, official music embeds, LRCLIB search, LRC timing checks, Android microphone permission, and platform installers."
      - name: Upload desktop packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release-assets -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 | xargs -0 -r gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber

  publish-android:
    name: Publish Android APK
    needs: android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: karaoke-studio-android
          path: release-assets
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Karaoke Studio ${{ github.ref_name }}" --prerelease --notes "Beta release."
          find release-assets -type f -name '*.apk' -print0 | xargs -0 -r gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber

  publish-ios:
    name: Publish iOS artifact
    needs: ios
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: karaoke-studio-ios
          path: release-assets
      - name: Upload IPA when available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Karaoke Studio ${{ github.ref_name }}" --prerelease --notes "Beta release."
          find release-assets -type f -name '*.ipa' -print0 | xargs -0 -r gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber
