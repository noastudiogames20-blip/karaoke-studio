name: Build Karaoke Studio

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-24.04
          - os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - name: Install dependencies
        run: npm ci
      - name: Build desktop packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BUNDLES="nsis,msi"; elif [ "$RUNNER_OS" = "macOS" ]; then BUNDLES="dmg"; else BUNDLES="appimage,deb,rpm"; fi
          npx tauri build --bundles "$BUNDLES"
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-studio-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'cmdline-tools;latest'
      - name: Install dependencies
        run: npm ci
      - name: Initialize Android project
        run: npx tauri android init
      - name: Build APK
        run: npx tauri android build --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-studio-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish-desktop:
    name: Publish desktop release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Karaoke Studio ${{ github.ref_name }}" \
            --prerelease \
            --notes "Beta release. Includes karaoke playback, LRC lyrics, microphone analysis, sound effects, in-app update checking and platform packages."
      - name: Upload desktop packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release-assets -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 | xargs -0 -r gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber

  publish-android:
    name: Publish Android APK
    needs: android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: karaoke-studio-android
          path: release-assets
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Karaoke Studio ${{ github.ref_name }}" --prerelease --notes "Beta release."
          find release-assets -type f -name '*.apk' -print0 | xargs -0 -r gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber
